<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>买号报销中心｜徐州舟格</title><link rel="stylesheet" href="theme/performance.css"></head><body>
<header class="top"><div class="brand">徐州舟格 <small>买号报销中心</small></div><nav id="nav" class="nav"></nav></header><main class="shell">
<div class="head"><div><h1>买号报销中心</h1><p>员工只提交买号费用和付款凭证；付款、冲销和重新待报销均由老板确认并留痕。</p></div><div class="filters"><input id="start" aria-label="开始日期" type="date"><span>至</span><input id="end" aria-label="结束日期" type="date"><select id="reimbursementStatus" aria-label="报销状态"><option value="待报销">待报销</option><option value="已报销">已报销</option><option value="无需报销">无需报销</option><option value="已冲销">已冲销</option><option value="">全部</option></select><button class="btn primary" data-query-button onclick="runQuery()">查询</button></div></div>
<div id="msg" class="msg" role="status" aria-live="polite"></div><div class="tip">报销是资金返还状态，不会再次计入账号成本，也不会改变阶段贡献利润。</div>
<section class="cards reimbursement-four"><div class="metric core"><div class="k">买号费用</div><div id="totalCost" class="v">¥0.00</div></div><div class="metric core profit"><div class="k">已报销</div><div id="paid" class="v">¥0.00</div></div><div class="metric core gmv"><div class="k">待报销</div><div id="pending" class="v">¥0.00</div></div><div class="metric core reimbursement-reversed"><div class="k">已冲销待处理</div><div id="reversed" class="v">¥0.00</div><div id="reversedCount" class="hint">0笔 · 处理后才能结算</div></div></section>
<section class="panel"><div class="panel-h"><div><h2>报销明细</h2><div id="countText" class="sub">0 条</div></div><span class="pill">仅已核账日报进入此处</span></div><div class="scroll"><table class="table mobile-cards"><thead><tr><th>日期 / 员工</th><th>小组</th><th>账号</th><th>费用</th><th>付款凭证</th><th>报销状态</th><th>最近处理</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div id="pager" class="pager" hidden><button id="prevPage" type="button" class="btn">上一页</button><span id="pageText" class="sub"></span><button id="nextPage" type="button" class="btn">下一页</button></div></section>
</main><script src="theme/performance.js"></script><script>
let ME=null,DATA=[],META=null,loadSeq=0,OFFSET=0;const LIMIT=100,statusSelect=byId('reimbursementStatus'),pagerEl=byId('pager'),prevPageButton=byId('prevPage'),nextPageButton=byId('nextPage'),pageTextEl=byId('pageText');
function latestEvent(x){const e=x.events&&x.events[0];return e?`${esc(e.actor)} · ${new Date(e.created*1000).toLocaleString('zh-CN',{hour12:false})}${e.payment_ref?'<div class="sub">参考号：'+esc(e.payment_ref)+'</div>':''}${e.note?'<div class="sub">'+esc(e.note)+'</div>':''}`:'<span class="sub">尚未处理</span>'}
function allowedTransitions(status){if(status==='待报销')return['已报销','无需报销'];if(status==='已报销')return['已冲销'];if(status==='已冲销')return['待报销'];return[]}
function actionCell(x){if(ME.role!=='admin')return'<span class="sub">仅老板可确认</span>';const options=allowedTransitions(x.status);if(!options.length)return'<span class="sub">当前状态无需操作</span>';return `<div class="account-actions"><select id="state-${x.id}" aria-label="${esc(x.account_name)}下一报销状态">${options.map(v=>`<option>${esc(v)}</option>`).join('')}</select><button class="btn" onclick="saveState(${x.id},this)">确认变更</button></div>`}
function renderPager(){if(!META){pagerEl.hidden=true;return}const offset=Number(META.offset)||0,total=Number(META.total??META.filtered_count)||0,returned=Number(META.returned??DATA.length);pagerEl.hidden=!(offset>0||META.has_more);prevPageButton.disabled=offset<=0;nextPageButton.disabled=!META.has_more;pageTextEl.textContent=total?`第 ${offset+1}-${Math.min(offset+returned,total)} 条 / 共 ${total} 条`:`本页 ${returned} 条`}
function render(){rows.innerHTML=DATA.length?DATA.map(x=>`<tr><td data-label="日期 / 员工"><b>${esc(x.biz_date)}</b><div class="sub">${esc(x.employee_name)}</div></td><td data-label="小组">${esc(x.group_name)}</td><td data-label="账号"><b>${esc(x.account_name)}</b><div class="sub">${esc(x.platform||'未填平台')}</div></td><td data-label="费用">${money(x.cost)}</td><td data-label="付款凭证">${voucherAnchor(x.voucher_url,'查看原付款凭证')}</td><td data-label="报销状态"><span class="status ${x.status==='已报销'?'confirmed':x.status==='待报销'?'pending':'rejected'}">${esc(x.status)}</span><div class="sub">第${Number(x.revision)||1}版</div></td><td data-label="最近处理">${latestEvent(x)}</td><td data-label="操作">${actionCell(x)}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">当前条件没有报销记录</td></tr>';labelDynamicControls(rows);renderPager()}
async function loadData(){const seq=++loadSeq;setPageLoading(true);try{const d=await api(`/ecom/v2/reimbursements?start=${encodeURIComponent(start.value)}&end=${encodeURIComponent(end.value)}&status=${encodeURIComponent(statusSelect.value)}&limit=${LIMIT}&offset=${OFFSET}`);if(seq!==loadSeq)return;DATA=d.rows;META=d.meta||d.rows_meta||d.reimbursements_meta||null;totalCost.textContent=money(d.summary.cost);paid.textContent=money(d.summary.paid);pending.textContent=money(d.summary.pending);reversed.textContent=money(d.summary.reversed);reversedCount.textContent=`${d.summary.reversed_count||0}笔 · 处理后才能结算`;countText.textContent=`${d.summary.count} 条`;render()}catch(e){if(seq===loadSeq)toast(e.message)}finally{if(seq===loadSeq)setPageLoading(false)}}
function runQuery(){OFFSET=0;clearToast();loadData()}
function newRequestKey(){return typeof crypto.randomUUID==='function'?crypto.randomUUID():`reimb-${Date.now()}-${Math.random().toString(36).slice(2)}`}
async function saveState(id,button){const item=DATA.find(x=>x.id===id),next=byId('state-'+id).value,revision=Number(item?.revision);if(!item||!Number.isInteger(revision)||revision<1)return toast('该报销记录版本缺失，请刷新后重试');let payment_ref='',note='';if(next==='已报销'||next==='已冲销'){const label=next==='已报销'?'转账单号或付款参考号':'冲销单号或冲销参考号';const entered=prompt(`${next==='已报销'?'确认报销':'确认冲销'} ${item.account_name} ${money(item.cost)}\n请输入${label}（必填）`,'');if(entered===null)return;payment_ref=entered.trim();if(payment_ref.length<4)return toast(`${label}至少4个字符`)}const reasonRequired=next!=='已报销';const enteredNote=prompt(reasonRequired?'请输入本次状态调整原因（必填）':'可填写付款备注（选填）','');if(enteredNote===null)return;note=enteredNote.trim();if(reasonRequired&&note.length<5)return toast('状态调整原因至少5个字符');if(!confirm(`确认将“${item.account_name}”从“${item.status}”设置为“${next}”？`))return;const requestKey=button.dataset.requestKey||newRequestKey();button.dataset.requestKey=requestKey;setBusy(button,true,'保存中…');try{await api('/ecom/v2/reimbursement/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({purchase_id:id,expected_revision:revision,status:next,payment_ref,note,request_key:requestKey})});delete button.dataset.requestKey;toast('报销状态已保存',true);await loadData()}catch(e){toast(e.message);if(e.message.includes('刷新')||e.message.includes('版本')){delete button.dataset.requestKey;await loadData()}}finally{setBusy(button,false)}}
prevPageButton.addEventListener('click',()=>{OFFSET=Math.max(0,OFFSET-(Number(META?.limit)||LIMIT));loadData()});nextPageButton.addEventListener('click',()=>{OFFSET+=(Number(META?.limit)||LIMIT);loadData()});
async function init(){try{const d=await identity();ME=d.me;if(ME.role!=='admin'&&!ME.is_leader)throw new Error('仅老板或组长可查看报销中心');renderNav(ME,'报销');const r=rangeOf('month');start.value=r[0];end.value=r[1];start.max=shDate();end.max=shDate();loadData()}catch(e){toast(e.message)}}init();
</script></body></html>
