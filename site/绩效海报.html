<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>员工利润排名海报｜徐州舟格</title><link rel="stylesheet" href="theme/performance.css"></head><body>
<header class="top"><div class="brand">徐州舟格 <small id="brandScope">经营战报</small></div><nav id="nav" class="nav"></nav></header><main class="shell"><div class="head"><div><h1>总GMV与员工利润排名海报</h1><p id="scopeHint">海报与经营看板共用同一套已核账数据。</p></div><div class="actions"><button class="btn" data-query-button type="button" onclick="loadData()">刷新数据</button><button id="downloadBtn" class="btn primary" type="button" disabled>下载PNG海报</button></div></div><div id="msg" class="msg" role="status" aria-live="polite"></div>
<section id="poster" class="poster"><div class="eyebrow">XUZHOU ZHOUGE · E-COMMERCE</div><h1 id="posterTitle">徐州舟格 · 经营战报</h1><div id="posterDate" class="poster-date"></div><div class="poster-metrics"><div class="poster-metric"><span>退款后净GMV</span><b id="pGmv">¥0.00</b></div><div class="poster-metric"><span>阶段贡献利润</span><b id="pProfit">¥0.00</b></div><div class="poster-metric"><span>广告实际消耗</span><b id="pAd">¥0.00</b></div><div class="poster-metric"><span>账号采购成本</span><b id="pCost">¥0.00</b></div><div class="poster-metric"><span>综合投入产出比</span><b id="pRoi">—</b></div><div class="poster-metric"><span>当前在管账号</span><b id="pAccounts">0</b></div></div><div class="poster-list"><h2>员工阶段贡献利润 TOP 榜</h2><div id="posterRanks"></div></div><div class="poster-list" style="margin-top:14px"><h2>小组综合投入产出比</h2><div id="posterGroups"></div></div><div class="poster-foot">数据只统计已核账日报。阶段贡献利润＝净GMV－广告实际消耗－账号成本，不等于工资、提成或公司净利润。</div></section></main>
<script src="theme/performance.js"></script><script>
let DATA=null,HAS_DATA=false,loadSeq=0,SCOPE_NAME='全公司';
const downloadButton=byId('downloadBtn');
function queryScope(){const p=new URLSearchParams(location.search),r=rangeOf('7d');return{start:p.get('start')||r[0],end:p.get('end')||r[1],group:p.get('group')||'0'}}
function scopeName(data){if(!data.scope_group)return'全公司';return data.groups.find(x=>x.group_no===data.scope_group)?.group_name||`第${data.scope_group}组`}
async function loadData(){const seq=++loadSeq,set=queryScope();setPageLoading(true);downloadButton.disabled=true;try{const next=await api(`/ecom/v2/dashboard?start=${encodeURIComponent(set.start)}&end=${encodeURIComponent(set.end)}&group=${encodeURIComponent(set.group)}`);if(seq!==loadSeq)return;DATA=next;SCOPE_NAME=scopeName(DATA);HAS_DATA=Number(DATA.company.report_count)>0;const c=DATA.company;byId('brandScope').textContent=`${SCOPE_NAME}经营战报`;byId('scopeHint').textContent=`${SCOPE_NAME} · ${DATA.start} 至 ${DATA.end}，与经营看板共用已核账数据。`;byId('posterTitle').textContent=`徐州舟格 · ${SCOPE_NAME}经营战报`;byId('posterDate').textContent=`统计周期：${DATA.start} 至 ${DATA.end}｜已核账数据｜当前账号库存不随日期筛选`;byId('pGmv').textContent=money(c.gmv);byId('pProfit').textContent=money(c.profit);byId('pAd').textContent=money(c.ad_spend);byId('pCost').textContent=money(c.account_cost);byId('pRoi').textContent=roiText(c.input_roi);byId('pAccounts').textContent=DATA.active_account_total;byId('posterRanks').innerHTML=DATA.leaderboard.slice(0,8).map((x,i)=>`<div class="poster-row"><span class="poster-num">${i+1}</span><div><b>${esc(x.name)}</b><div class="sub" style="color:#ddd6fe">${esc(x.group_name)} · 净GMV ${money(x.gmv)}</div></div><b>${money(x.profit)}</b></div>`).join('')||'<div class="poster-row"><span style="grid-column:1/-1">暂无已核账员工数据</span></div>';const rankedGroups=DATA.groups.filter(x=>x.report_count>0).sort((a,b)=>(b.input_roi??-999)-(a.input_roi??-999));byId('posterGroups').innerHTML=rankedGroups.map((x,i)=>`<div class="poster-row"><span class="poster-num">${i+1}</span><b>${esc(x.group_name)}</b><b>${roiText(x.input_roi)}</b></div>`).join('')||'<div class="poster-row"><span style="grid-column:1/-1">暂无已核账小组数据</span></div>';downloadButton.disabled=!HAS_DATA;if(!HAS_DATA)toast('当前范围没有已核账日报，已暂停生成空白海报')}catch(e){if(seq===loadSeq)toast(e.message)}finally{if(seq===loadSeq)setPageLoading(false)}}
function roundRect(ctx,x,y,w,h,r,fill){ctx.beginPath();if(typeof ctx.roundRect==='function')ctx.roundRect(x,y,w,h,r);else{const q=Math.min(r,w/2,h/2);ctx.moveTo(x+q,y);ctx.arcTo(x+w,y,x+w,y+h,q);ctx.arcTo(x+w,y+h,x,y+h,q);ctx.arcTo(x,y+h,x,y,q);ctx.arcTo(x,y,x+w,y,q)}ctx.fillStyle=fill;ctx.fill()}
function drawText(ctx,text,x,y,size=28,color='#fff',weight='normal',align='left',maxWidth=0,minSize=14){let fontSize=size,value=String(text??'');ctx.textAlign=align;ctx.fillStyle=color;while(maxWidth&&fontSize>minSize){ctx.font=`${weight} ${fontSize}px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif`;if(ctx.measureText(value).width<=maxWidth)break;fontSize--}ctx.font=`${weight} ${fontSize}px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif`;if(maxWidth&&ctx.measureText(value).width>maxWidth){while(value.length>1&&ctx.measureText(value+'…').width>maxWidth)value=value.slice(0,-1);value+='…'}ctx.fillText(value,x,y)}
function canvasToBlob(canvas){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('海报生成失败，请重试')),'image/png'))}
async function downloadPoster(){if(!DATA||!HAS_DATA)return toast('当前范围没有已核账数据，不能生成空白海报');setBusy(downloadButton,true,'生成中…');try{const cv=document.createElement('canvas');cv.width=1080;cv.height=1440;const c=cv.getContext('2d'),g=c.createLinearGradient(0,0,1080,1440);g.addColorStop(0,'#111827');g.addColorStop(.5,'#312e81');g.addColorStop(1,'#5b21b6');c.fillStyle=g;c.fillRect(0,0,1080,1440);drawText(c,'XUZHOU ZHOUGE · E-COMMERCE',70,85,22,'#c4b5fd','600');drawText(c,`徐州舟格 · ${SCOPE_NAME}经营战报`,70,145,44,'#fff','800','left',940,28);drawText(c,`${DATA.start} 至 ${DATA.end}｜已核账数据`,70,190,22,'#ddd6fe','normal','left',940,16);const metrics=[['退款后净GMV',money(DATA.company.gmv)],['阶段贡献利润',money(DATA.company.profit)],['广告实际消耗',money(DATA.company.ad_spend)],['账号采购成本',money(DATA.company.account_cost)],['综合投入产出比',roiText(DATA.company.input_roi)],['当前在管账号',String(DATA.active_account_total)]];metrics.forEach((m,i)=>{const col=i%3,row=Math.floor(i/3),x=70+col*320,y=235+row*135;roundRect(c,x,y,290,112,16,'rgba(255,255,255,.11)');drawText(c,m[0],x+18,y+34,19,'#ddd6fe','normal','left',250,15);drawText(c,m[1],x+18,y+80,31,'#fff','800','left',250,19)});roundRect(c,70,525,940,590,20,'rgba(255,255,255,.09)');drawText(c,'员工阶段贡献利润 TOP 榜',100,580,29,'#fff','800');const list=DATA.leaderboard.slice(0,8);list.forEach((x,i)=>{const y=640+i*58;drawText(c,String(i+1),105,y,26,'#fde68a','900');drawText(c,x.name,160,y,25,'#fff','700','left',230,16);drawText(c,x.group_name,410,y,20,'#ddd6fe','normal','left',250,14);drawText(c,money(x.profit),960,y,25,x.profit<0?'#fda4af':'#86efac','800','right',270,17)});roundRect(c,70,1140,940,160,20,'rgba(255,255,255,.09)');drawText(c,'小组综合投入产出比 TOP 3',100,1192,26,'#fff','800');const groups=DATA.groups.filter(x=>x.report_count>0).sort((a,b)=>(b.input_roi??-999)-(a.input_roi??-999)).slice(0,3);groups.forEach((x,i)=>{drawText(c,`${i+1}. ${x.group_name}`,115+i*300,1255,22,'#ddd6fe','700','left',260,15);drawText(c,roiText(x.input_roi),115+i*300,1290,27,'#fff','800')});drawText(c,'阶段贡献利润＝净GMV－广告实际消耗－账号成本；不等于工资、提成或公司净利润。',70,1375,20,'#ddd6fe','normal','left',940,14);const blob=await canvasToBlob(cv),url=URL.createObjectURL(blob),a=document.createElement('a');a.download=`徐州舟格_${SCOPE_NAME}_经营战报_${DATA.start}_${DATA.end}.png`;a.href=url;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('PNG海报已生成',true)}catch(e){toast(e.message)}finally{setBusy(downloadButton,false);downloadButton.disabled=!HAS_DATA}}
downloadButton.addEventListener('click',downloadPoster);async function init(){try{const d=await identity();renderNav(d.me,'绩效海报');await loadData()}catch(e){toast(e.message)}}init();
</script></body></html>
