<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>人员与分组｜徐州舟格</title><link rel="stylesheet" href="theme/performance.css"></head><body>
<header class="top"><div class="brand">徐州舟格 <small>人员与分组</small></div><nav id="nav" class="nav"></nav></header><main class="shell"><div class="head"><div><h1>人员与分组</h1><p>基础岗位只有老板和运营；组长是运营人员上的附加权限。</p></div></div><div id="msg" class="msg" role="status" aria-live="polite"></div>
<section id="memberPanel" class="panel"><div class="panel-h"><div><h2>新增 / 修改运营人员</h2><div class="sub">新增时必须设置个人登录密码；编辑时姓名锁定，密码留空表示不变</div></div></div><div class="panel-b"><div class="grid"><div class="field"><label for="memberName">员工姓名 *</label><input id="memberName" type="text" maxlength="24" autocomplete="off"></div><div class="field"><label for="phone">手机号 *</label><input id="phone" type="tel" maxlength="15" autocomplete="tel"></div><div class="field"><label for="groupNo">所属小组 *</label><select id="groupNo"></select></div><div class="field"><label for="loginPassword">个人登录密码</label><input id="loginPassword" type="password" minlength="6" autocomplete="new-password" placeholder="新增必填，至少6位"></div><div class="field"><label for="leader">组长附加权限</label><select id="leader"><option value="0">普通运营</option><option value="1">本组组长</option></select></div><div class="field"><label for="active">账号状态</label><select id="active"><option value="1">启用</option><option value="0">停用</option></select></div></div><div class="actions" style="margin-top:14px"><button id="resetMemberBtn" type="button" class="btn">清空</button><button id="saveMemberBtn" type="button" class="btn primary">保存人员</button></div></div></section>
<details class="panel group-editor-panel"><summary class="panel-h"><span><b>8个小组名称</b><span class="sub"> · 默认沿用第1组至第8组，需要改名时展开</span></span><span class="pill">历史日报保留组号快照</span></summary><div id="groupEditors" class="panel-b grid"></div></details>
<section class="panel"><div class="panel-h"><h2>运营人员清单</h2><span id="memberCount" class="pill"></span></div><div class="scroll"><table class="table"><thead><tr><th>姓名</th><th>手机号</th><th>小组</th><th>身份</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script src="theme/performance.js"></script><script>
let DATA=null,loadSeq=0,editingName='';
const nameInput=byId('memberName'),phoneInput=byId('phone'),groupSelect=byId('groupNo'),passwordInput=byId('loginPassword'),leaderSelect=byId('leader'),activeSelect=byId('active'),rowsEl=byId('rows'),saveButton=byId('saveMemberBtn');
async function load(){const seq=++loadSeq;setPageLoading(true);try{const next=await api('/ecom/v2/members');if(seq!==loadSeq)return;DATA=next;render()}catch(e){if(seq===loadSeq)toast(e.message)}finally{if(seq===loadSeq)setPageLoading(false)}}
function render(){groupSelect.innerHTML=DATA.groups.map(x=>`<option value="${x.group_no}">${esc(x.group_name)}</option>`).join('');byId('groupEditors').innerHTML=DATA.groups.map(x=>`<div class="field"><label for="g${x.group_no}">第${x.group_no}组</label><div class="actions"><input id="g${x.group_no}" type="text" maxlength="30" value="${esc(x.group_name)}"><button type="button" class="btn save-group" data-group="${x.group_no}">保存</button></div></div>`).join('');byId('memberCount').textContent=`${DATA.members.length}人`;rowsEl.innerHTML=DATA.members.map((x,i)=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}</td><td>${esc(x.group_name)}</td><td>${x.is_leader?'<span class="pill">组长 + 运营</span>':'普通运营'}</td><td><span class="status ${x.active?'confirmed':'rejected'}">${x.active?'启用':'停用'}</span></td><td><button type="button" class="btn edit-member" data-index="${i}">编辑</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">尚未添加运营人员</td></tr>';labelDynamicControls()}
async function saveGroup(n,button){const input=byId('g'+n);setBusy(button,true,'保存中…');try{await api('/ecom/v2/group/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({group_no:n,group_name:input.value.trim()})});toast('组名已保存',true);await load()}catch(e){toast(e.message)}finally{setBusy(button,false)}}
async function saveMember(){const payload={name:nameInput.value.trim(),phone:phoneInput.value.trim(),group_no:Number(groupSelect.value),login_password:passwordInput.value,is_leader:leaderSelect.value==='1',active:activeSelect.value==='1'},wasEditing=Boolean(editingName);let saved=false;setBusy(saveButton,true,'保存中…');try{await api('/ecom/v2/member/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});saved=true;toast(wasEditing?'人员资料已更新':'人员已新增',true);await load()}catch(e){toast(e.message)}finally{setBusy(saveButton,false);if(saved)resetForm()}}
function editMemberAt(index){const x=DATA?.members[index];if(!x)return;editingName=x.name;nameInput.value=x.name;nameInput.readOnly=true;nameInput.setAttribute('aria-describedby','nameEditHint');if(!byId('nameEditHint')){const hint=document.createElement('div');hint.id='nameEditHint';hint.className='sub';hint.textContent='编辑状态下姓名不可修改；如需更名请先确认历史日报与账号归属迁移规则。';nameInput.insertAdjacentElement('afterend',hint)}phoneInput.value=x.phone;groupSelect.value=x.group_no;leaderSelect.value=x.is_leader?'1':'0';activeSelect.value=x.active?'1':'0';passwordInput.value='';saveButton.textContent='保存修改';window.scrollTo({top:byId('memberPanel').offsetTop-70,behavior:'smooth'});nameInput.focus()}
function resetForm(){editingName='';nameInput.readOnly=false;nameInput.removeAttribute('aria-describedby');byId('nameEditHint')?.remove();nameInput.value='';phoneInput.value='';passwordInput.value='';leaderSelect.value='0';activeSelect.value='1';saveButton.textContent='保存人员'}
byId('groupEditors').addEventListener('click',e=>{const button=e.target.closest('.save-group');if(button)saveGroup(Number(button.dataset.group),button)});rowsEl.addEventListener('click',e=>{const button=e.target.closest('.edit-member');if(button)editMemberAt(Number(button.dataset.index))});byId('resetMemberBtn').addEventListener('click',resetForm);saveButton.addEventListener('click',saveMember);
async function init(){try{const d=await identity();renderNav(d.me,'人员分组');await load()}catch(e){toast(e.message)}}init();
</script></body></html>
