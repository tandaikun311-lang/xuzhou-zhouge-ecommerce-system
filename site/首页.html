<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>徐州舟格电商运营管理系统</title><link rel="stylesheet" href="theme/performance.css"><style>.hero{background:linear-gradient(135deg,#111827,#312e81);color:#fff;border-radius:22px;padding:45px;margin-bottom:18px}.hero .eyebrow{letter-spacing:3px;color:#c4b5fd;font-size:12px}.hero h1{font-size:38px;margin:12px 0}.hero p{color:#ddd6fe;max-width:760px}.portal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.portal a{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;color:var(--ink);text-decoration:none}.portal a:hover{border-color:#a5b4fc;box-shadow:0 8px 25px rgba(49,46,129,.08)}.portal .ico{font-size:27px}.portal h3{margin:10px 0 5px}.portal p{color:var(--sub);margin:0}.portal .tag{display:inline-block;margin-top:14px;padding:4px 8px;border-radius:999px;background:#ecfdf3;color:#027a48;font-size:12px}@media(max-width:760px){.hero{padding:30px 20px}.hero h1{font-size:29px}.portal{grid-template-columns:1fr}}</style></head><body>
<header class="top"><div class="brand">徐州舟格 <small>电商运营管理系统</small></div><nav id="nav" class="nav"></nav></header><main class="shell"><div id="msg" class="msg"></div><section class="hero"><div class="eyebrow">XUZHOU ZHOUGE · E-COMMERCE OPERATIONS</div><h1>公司经营与员工绩效系统</h1><p>每天记录GMV、退款、广告消耗、账号采购与账号状态；系统自动生成公司、小组、员工三个层级的当天、近7天和本月数据。</p></section><a id="todo" class="reject-note" href="每日填报.html" style="display:none;text-decoration:none;margin-bottom:14px"></a><section id="portal" class="portal"></section><div class="tip" style="margin-top:16px">员工端只提供每日填报，不展示底薪、提成或“我的”页面。组长仍是运营人员，可以填自己的日报，同时查看和管理本组数据。</div></main>
<script src="theme/performance.js"></script><script>
async function init(){try{const d=await identity(),me=d.me;renderNav(me,'首页');let cards=[["📝",me.role==='admin'?'日报补录与纠错':'每日经营填报',me.role==='admin'?'选择运营员工补录或纠错原始日报':'填写本人GMV、消耗、买号和账号状态','每日填报.html',me.role==='admin'?'老板代填':'运营入口']];if(me.role!=='admin'&&me.is_leader)cards.push(['📋','组内经营看板','查看本组员工、投入回报和账号状态','组内看板.html','组长权限'],['💳','买号报销中心','查看本组已核账买号费用和报销进度','报销中心.html','组长查看']);if(me.role==='admin')cards.push(['📊','公司总后台','公司、小组与员工绩效汇总','后台.html','老板权限'],['✅','财务核账','确认日报后进入正式排名','核账中心.html','第1步'],['💳','买号报销中心','核账后确认付款、冲销并保留凭据','报销中心.html','第2步'],['🔒','期间结算中心','报销处理完成后生成不可变结算快照','结算中心.html','第3步'],['🗂️','账号资产台账','查看所有账号数量与当前状态','账号台账.html','老板权限'],['🏆','近7天绩效海报','总GMV与员工利润排名PNG','绩效海报.html','老板权限'],['👥','人员与分组','配置8组、员工和组长','人员分组.html','老板权限']);portal.innerHTML=cards.map(x=>`<a href="${x[3]}"><div class="ico">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><span class="tag">${x[4]}</span></a>`).join('');if(me.role!=='admin'){const r=await api('/ecom/v2/my/reports?days=7'),bad=r.reports.filter(x=>x.status==='rejected');if(bad.length){todo.style.display='block';todo.href=`每日填报.html?date=${encodeURIComponent(bad[0].biz_date)}`;todo.textContent=`你有 ${bad.length} 条日报被退回待修改。最新：${bad[0].biz_date}，原因：${bad[0].reconcile_note||'请查看详情'}。点击处理 →`}}}catch(e){toast(e.message)}}init();
</script></body></html>
