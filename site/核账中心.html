<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>财务核账中心｜徐州舟格</title><link rel="stylesheet" href="theme/performance.css"></head><body>
<header class="top"><div class="brand">徐州舟格 <small>财务核账中心</small></div><nav id="nav" class="nav"></nav></header><main class="shell"><div class="head"><div><h1>财务核账中心</h1><p>待核账和退回数据不进入员工利润排名与绩效海报。</p></div><div class="filters"><input id="start" aria-label="开始日期" type="date"><span>至</span><input id="end" aria-label="结束日期" type="date"><select id="filter" aria-label="核账状态筛选"><option value="pending">待核账</option><option value="rejected">已退回</option><option value="confirmed">已核账</option><option value="all">全部</option></select><button class="btn primary" data-query-button onclick="runQuery()">查询</button></div></div><div id="msg" class="msg" role="status" aria-live="polite"></div><div class="tip">核账重点：支付GMV和退款分开；充值不等于消耗；买号凭证必须有效；报销不重复计成本。</div>
<section class="cards"><div class="metric"><div class="k">待核账</div><div id="pending" class="v">0</div></div><div class="metric"><div class="k">已核账</div><div id="confirmed" class="v">0</div></div><div class="metric"><div class="k">已退回</div><div id="rejected" class="v">0</div></div></section>
<section class="panel"><div class="scroll"><table class="table mobile-cards"><thead><tr><th>日期 / 员工</th><th>小组</th><th>状态</th><th>支付GMV</th><th>退款</th><th>净GMV</th><th>广告消耗</th><th>账号成本 / 凭证</th><th>阶段贡献利润</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div id="pager" class="pager" hidden><button id="prevPage" type="button" class="btn">上一页</button><span id="pageText" class="sub"></span><button id="nextPage" type="button" class="btn">下一页</button></div></section></main>
<script src="theme/performance.js"></script><script>
let DATA=[],META=null,loadSeq=0,OFFSET=0;const LIMIT=100,pagerEl=byId('pager'),prevPageButton=byId('prevPage'),nextPageButton=byId('nextPage'),pageTextEl=byId('pageText');
function renderPager(){if(!META){pagerEl.hidden=true;return}const offset=Number(META.offset)||0,total=Number(META.total)||0,returned=Number(META.returned??DATA.length);pagerEl.hidden=!(offset>0||META.has_more);prevPageButton.disabled=offset<=0;nextPageButton.disabled=!META.has_more;pageTextEl.textContent=total?`第 ${offset+1}-${Math.min(offset+returned,total)} 条 / 共 ${total} 条`:`本页 ${returned} 条`}
function render(){rows.innerHTML=DATA.map(x=>`<tr><td data-label="日期 / 员工"><b>${esc(x.biz_date)}</b><div class="sub">${esc(x.employee_name)}${x.is_resubmitted?' · 重提第'+x.revision+'版':''}</div></td><td data-label="小组">${esc(x.group_name)}</td><td data-label="状态"><span class="status ${x.status}">${statusText(x.status)}</span>${x.reconcile_note?`<div class="reject-note">${esc(x.reconcile_note)}</div>`:''}${x.last_rejection_note&&x.status==='pending'?`<div class="sub">上次退回：${esc(x.last_rejection_note)}</div>`:''}</td><td data-label="支付GMV">${money(x.gross_gmv)}</td><td data-label="退款">${money(x.refund)}</td><td data-label="净GMV">${money(x.gmv)}</td><td data-label="广告消耗">${money(x.ad_spend)}</td><td data-label="账号成本 / 凭证">${money(x.summary.account_cost)}${x.purchases.map((p,i)=>`<div>${voucherAnchor(p.voucher_url,p.account_name+'凭证'+(i+1))} · ${esc(p.reimbursement_status)}</div>`).join('')}<details class="audit-detail"><summary>充值与出单详情</summary><div>充值：${x.recharges.length?x.recharges.map(a=>esc(a.type)+' '+money(a.amount)).join('；'):'无'}</div><div>当日上报已出单账号：${[...x.purchases,...x.account_updates].filter(a=>a.account_status==='已出单').map(a=>esc(a.account_name)).join('、')||'无'}</div></details></td><td data-label="阶段贡献利润" class="${x.summary.profit<0?'negative':'positive'}">${money(x.summary.profit)}</td><td data-label="操作"><div class="actions">${x.status==='pending'?`<button class="btn good" onclick="setStatus(${x.id},'confirmed',this)">确认</button> <button class="btn danger" onclick="setStatus(${x.id},'rejected',this)">退回</button>`:x.status==='confirmed'?`<button class="btn danger" onclick="setStatus(${x.id},'rejected',this)">退回纠错</button>`:'<span class="sub">等待员工修改重提</span>'}</div></td></tr>`).join('')||'<tr><td colspan="10" class="empty">当前条件没有日报</td></tr>';labelDynamicControls(rows);renderPager()}
async function loadData(){const seq=++loadSeq;setPageLoading(true);try{const status=filter.value==='all'?'':filter.value,d=await api(`/ecom/v2/dashboard?start=${encodeURIComponent(start.value)}&end=${encodeURIComponent(end.value)}&include=reports&report_status=${encodeURIComponent(status)}&report_limit=${LIMIT}&report_offset=${OFFSET}`);if(seq!==loadSeq)return;DATA=d.reports;META=d.reports_meta||null;pending.textContent=d.status_counts.pending;confirmed.textContent=d.status_counts.confirmed;rejected.textContent=d.status_counts.rejected;render()}catch(e){if(seq===loadSeq)toast(e.message)}finally{if(seq===loadSeq)setPageLoading(false)}}
function runQuery(){OFFSET=0;clearToast();loadData()}
async function setStatus(id,status,button){const item=DATA.find(x=>x.id===id),revision=Number(item?.revision);if(!item||!Number.isInteger(revision)||revision<1)return toast('日报版本缺失，请刷新后重试');let note='';if(status==='rejected'){note=prompt(`退回 ${item.employee_name} · ${item.biz_date} 日报，请输入原因（必填）`,'');if(note===null)return;if(!note.trim())return toast('退回原因不能为空')}else if(!confirm(`确认核账：${item.employee_name} · ${item.biz_date}\n净GMV ${money(item.gmv)} · 阶段利润 ${money(item.summary?.profit)}\n请确认归属、金额和凭证均无误。`))return;setBusy(button,true,status==='confirmed'?'确认中…':'退回中…');try{await api('/ecom/v2/reconcile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status,note,expected_revision:revision})});toast('核账状态已更新',true);await loadData()}catch(e){toast(e.message);if(e.message.includes('刷新')||e.message.includes('版本')||e.message.includes('变化'))await loadData()}finally{setBusy(button,false)}}
prevPageButton.addEventListener('click',()=>{OFFSET=Math.max(0,OFFSET-(Number(META?.limit)||LIMIT));loadData()});nextPageButton.addEventListener('click',()=>{OFFSET+=(Number(META?.limit)||LIMIT);loadData()});
filter.onchange=runQuery;async function init(){try{const d=await identity();renderNav(d.me,'核账');const r=rangeOf('7d');start.value=r[0];end.value=r[1];start.max=shDate();end.max=shDate();loadData()}catch(e){toast(e.message)}}init();
</script></body></html>
