<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>登录｜徐州舟格电商运营管理系统</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,#4338ca 0,#111827 42%,#070b14 100%);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033}.box{width:min(430px,calc(100% - 28px));background:#fff;border-radius:22px;padding:30px;box-shadow:0 28px 80px rgba(0,0,0,.4)}.eyebrow{color:#5b5bd6;letter-spacing:2px;font-size:11px;font-weight:800}.box h1{margin:10px 0 5px;font-size:27px}.box p{color:#667085;margin:0 0 22px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f2f4f7;border-radius:10px;padding:4px;margin-bottom:18px}.tabs button{height:40px;border:0;border-radius:8px;background:none;font-weight:700;cursor:pointer}.tabs button.on{background:#fff;color:#3730a3;box-shadow:0 2px 8px rgba(16,24,40,.08)}label{display:block;font-weight:650;color:#475467;margin:12px 0 6px}input{width:100%;height:44px;border:1px solid #d0d5dd;border-radius:9px;padding:0 11px;font-size:15px}.submit{width:100%;height:46px;border:0;border-radius:9px;background:#5b5bd6;color:#fff;font-weight:800;margin-top:20px;cursor:pointer}.err{display:none;background:#fef3f2;color:#b42318;padding:10px 12px;border-radius:8px;margin-top:12px}.hint{font-size:12px;color:#667085;margin-top:14px}.hide{display:none}@media(max-width:480px){.box{padding:24px 20px}}</style></head><body>
<main class="box"><div class="eyebrow">XUZHOU ZHOUGE · E-COMMERCE</div><h1>徐州舟格运营系统</h1><p>员工每日填报 · 小组数据管理 · 公司经营总览</p><div class="tabs" role="tablist" aria-label="登录身份"><button id="empTab" type="button" role="tab" aria-selected="true" class="on" onclick="setRole('employee')">运营员工</button><button id="adminTab" type="button" role="tab" aria-selected="false" onclick="setRole('admin')">老板 / 管理员</button></div><form id="loginForm"><section id="identity"><label for="name">真实姓名</label><input id="name" autocomplete="username" placeholder="与管理员登记姓名一致"><label for="phone">手机号</label><input id="phone" type="tel" inputmode="numeric" placeholder="用于核对本人身份"></section><label for="password">登录密码</label><input id="password" type="password" autocomplete="current-password" placeholder="请输入个人登录密码"><button id="submit" type="submit" class="submit">登录系统</button></form><div id="err" class="err" role="alert" aria-live="polite"></div><div id="hint" class="hint">员工使用管理员分配的个人密码。组长仍从“运营员工”入口登录。</div></main>
<script>const API='/board/api',nameInput=document.getElementById('name'),phoneInput=document.getElementById('phone'),passwordInput=document.getElementById('password');let role='employee';function setRole(r){role=r;empTab.classList.toggle('on',r==='employee');adminTab.classList.toggle('on',r==='admin');empTab.setAttribute('aria-selected',String(r==='employee'));adminTab.setAttribute('aria-selected',String(r==='admin'));empTab.tabIndex=r==='employee'?0:-1;adminTab.tabIndex=r==='admin'?0:-1;identity.classList.toggle('hide',r==='admin');hint.textContent=r==='admin'?'管理员使用独立管理密码。':'员工使用管理员分配的个人密码。组长仍从“运营员工”入口登录。';passwordInput.value='';err.style.display='none';passwordInput.focus()}async function login(){err.style.display='none';submit.disabled=true;submit.textContent='登录中…';try{const body={password:passwordInput.value};if(role==='employee'){body.name=nameInput.value.trim();body.phone=phoneInput.value.trim()}const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.err||'登录失败');if(role==='admin'&&d.role!=='admin')throw new Error('请使用管理员密码');location.href='首页.html'}catch(e){err.textContent=e.message;err.style.display='block';passwordInput.focus()}finally{submit.disabled=false;submit.textContent='登录系统'}}loginForm.addEventListener('submit',e=>{e.preventDefault();login()});</script></body></html>
