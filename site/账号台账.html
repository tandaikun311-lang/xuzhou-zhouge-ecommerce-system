<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>账号资产台账｜徐州舟格</title><link rel="stylesheet" href="theme/performance.css"></head><body>
<header class="top"><div class="brand">徐州舟格 <small>账号资产台账</small></div><nav id="nav" class="nav"></nav></header><main class="shell"><div class="head"><div><h1>账号资产台账</h1><p>买号日报核账确认后才进入正式账号档案；退回数据不会计入账号总数。</p></div><div class="filters"><select id="group" aria-label="小组筛选"><option value="0">全公司</option></select><select id="statusFilter" aria-label="账号状态筛选"><option value="all">全部状态</option></select><input id="keyword" aria-label="账号或员工关键词" type="text" placeholder="账号/员工搜索"><button class="btn primary" data-query-button type="button" onclick="applyFilters()">全量筛选</button></div></div><div id="msg" class="msg" role="status" aria-live="polite"></div>
<div id="stats" class="account-grid"></div><section class="panel"><div class="scroll"><table class="table"><thead><tr><th>账号名称</th><th>平台</th><th>归属员工</th><th>小组</th><th>购买日期</th><th>账号成本</th><th>付款凭证</th><th>当前状态</th><th>备注</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div id="pager" class="pager" hidden><button id="prevPage" type="button" class="btn">上一页</button><span id="pageText" class="sub"></span><button id="nextPage" type="button" class="btn">下一页</button></div></section></main>
<script src="theme/performance.js"></script><script>
let DATA=null,STATUSES=[],loadSeq=0,OFFSET=0;const LIMIT=100,pagerEl=byId('pager'),prevPageButton=byId('prevPage'),nextPageButton=byId('nextPage'),pageTextEl=byId('pageText');
async function load(){const seq=++loadSeq;setPageLoading(true);try{const r=rangeOf('month'),status=statusFilter.value==='all'?'':statusFilter.value,next=await api(`/ecom/v2/dashboard?start=${encodeURIComponent(r[0])}&end=${encodeURIComponent(r[1])}&group=${encodeURIComponent(group.value)}&include=accounts&account_limit=${LIMIT}&account_offset=${OFFSET}&account_status=${encodeURIComponent(status)}&account_keyword=${encodeURIComponent(keyword.value.trim())}`);if(seq!==loadSeq)return;DATA=next;render()}catch(e){if(seq===loadSeq)toast(e.message)}finally{if(seq===loadSeq)setPageLoading(false)}}
function applyFilters(){OFFSET=0;load()}
function renderPager(){const meta=DATA?.accounts_meta;if(!meta){pagerEl.hidden=true;return}const offset=Number(meta.offset)||0,total=Number(meta.total)||0,returned=Number(meta.returned??DATA.accounts.length);pagerEl.hidden=!(offset>0||meta.has_more);prevPageButton.disabled=offset<=0;nextPageButton.disabled=!meta.has_more;pageTextEl.textContent=total?`第 ${offset+1}-${Math.min(offset+returned,total)} 个 / 共 ${total} 个`:`本页 ${returned} 个`}
function render(){if(!DATA)return;stats.innerHTML=Object.entries(DATA.account_status_breakdown).map(x=>`<div class="account-stat"><span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join('');rows.innerHTML=DATA.accounts.map(x=>`<tr><td><b>${esc(x.account_name)}</b></td><td>${esc(x.platform||'—')}</td><td>${esc(x.owner_name)}</td><td>${esc(x.group_name)}</td><td>${esc(x.purchase_date||'—')}</td><td>${money(x.purchase_cost)}</td><td>${voucherAnchor(x.voucher_url,'查看')}</td><td><select class="account-status" data-status="${esc(x.account_status)}" aria-label="${esc(x.account_name)}账号状态" id="s${x.id}">${STATUSES.map(v=>`<option ${v===x.account_status?'selected':''}>${esc(v)}</option>`).join('')}</select></td><td><input aria-label="${esc(x.account_name)}账号备注" id="n${x.id}" type="text" maxlength="200" value="${esc(x.note||'')}"></td><td><button type="button" class="btn" onclick="save(${x.id},${Number(x.revision)||1},this)">保存</button></td></tr>`).join('')||'<tr><td colspan="10" class="empty">全部账号中没有匹配结果</td></tr>';rows.querySelectorAll('.account-status').forEach(el=>el.addEventListener('change',()=>el.dataset.status=el.value));labelDynamicControls(rows);renderPager()}
async function save(id,revision,button){const select=byId('s'+id);setBusy(button,true,'保存中…');select.disabled=true;try{await api('/ecom/v2/account/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,expected_revision:revision,account_status:select.value,note:byId('n'+id).value})});toast('账号状态已更新',true);await load()}catch(e){toast(e.message);if(e.message.includes('刷新'))await load()}finally{select.disabled=false;setBusy(button,false)}}
prevPageButton.addEventListener('click',()=>{OFFSET=Math.max(0,OFFSET-(Number(DATA?.accounts_meta?.limit)||LIMIT));load()});nextPageButton.addEventListener('click',()=>{OFFSET+=(Number(DATA?.accounts_meta?.limit)||LIMIT);load()});
async function init(){try{const d=await identity();renderNav(d.me,'账号台账');STATUSES=d.account_statuses;group.innerHTML+=d.groups.map(x=>`<option value="${x.group_no}">${esc(x.group_name)}</option>`).join('');statusFilter.innerHTML+=STATUSES.map(x=>`<option>${esc(x)}</option>`).join('');group.onchange=applyFilters;statusFilter.onchange=applyFilters;keyword.addEventListener('keydown',e=>{if(e.key==='Enter')applyFilters()});load()}catch(e){toast(e.message)}}init();
</script></body></html>
