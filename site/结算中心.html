<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>期间结算中心｜徐州舟格</title><link rel="stylesheet" href="theme/performance.css"></head><body>
<header class="top"><div class="brand">徐州舟格 <small>期间结算中心</small></div><nav id="nav" class="nav"></nav></header><main class="shell">
<div class="head"><div><h1>期间结算中心</h1><p>把已核账数据形成带哈希的不可变快照；结算后日报和核账状态将锁定。</p></div></div><div id="msg" class="msg" role="status" aria-live="polite"></div>
<section class="panel"><div class="panel-h"><div><h2>新建结算</h2><div class="sub">先处理待核账、已退回、冲销待处理和待报销，再进行日结、周结或月结。</div></div></div><div class="panel-b"><div class="grid"><div class="field"><label for="start">开始日期</label><input id="start" type="date"></div><div class="field"><label for="end">结束日期</label><input id="end" type="date"></div><div class="field"><label for="group">结算范围</label><select id="group"><option value="0">全公司</option></select></div><div class="field"><label for="note">结算说明</label><input id="note" type="text" maxlength="300" placeholder="例：2026年8月第4周结算"></div><div class="field span2"><label class="check-line"><input id="allowMissing" type="checkbox"> 已核实漏报属于休假、轮休或未排班，允许带说明结算</label><div class="sub">当前系统按启用成员×自然日判断漏报，尚未配置排班与请假豁免。</div></div></div><div id="preflight" class="preflight"><b>结算预检读取中</b><span>选择日期和范围后自动检查阻断项</span></div><div class="sticky-actions"><button id="closeBtn" class="btn primary" onclick="closeSettlement(this)">生成结算快照</button></div></div></section>
<section class="panel"><div class="panel-h"><div><h2>结算版本</h2><div class="sub">重新打开不会删除旧快照；修正后再结算会生成新版本。</div></div><button class="btn" data-query-button onclick="loadData()">刷新</button></div><div class="scroll"><table class="table mobile-cards"><thead><tr><th>期间 / 范围</th><th>版本</th><th>状态</th><th>净GMV</th><th>综合投入</th><th>阶段贡献利润</th><th>日报 / 漏报</th><th>快照校验</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<div class="tip">结算快照用于公司内部运营核账，不替代银行流水、平台账单、发票或法定财务账。</div>
</main><script src="theme/performance.js"></script><script>
let DATA=[],loadSeq=0;
function scopeName(x){return x.group_no===0?'全公司':`第${x.group_no}组`}
let previewTimer=0;
function schedulePreview(){clearTimeout(previewTimer);previewTimer=setTimeout(loadPreview,180)}
async function loadPreview(){if(!start.value||!end.value||start.value>end.value){preflight.className='preflight blocked';preflight.innerHTML='<b>日期范围不正确</b><span>请选择有效的开始和结束日期</span>';closeBtn.disabled=true;return}try{const d=await api(`/ecom/v2/settlement/preview?start=${encodeURIComponent(start.value)}&end=${encodeURIComponent(end.value)}&group=${encodeURIComponent(group.value)}`),s=d.snapshot,c=s.company||{};const onlyMissing=d.ready_with_missing;preflight.className='preflight '+(d.ready?'ready':onlyMissing?'warning':'blocked');preflight.innerHTML=`<div><b>${d.ready?'预检通过，可以结算':onlyMissing?'仅剩漏报例外，核实后可带说明结算':'暂不能结算'}</b><span>已核账 ${s.status_counts.confirmed} 份 · 待核 ${s.status_counts.pending} · 退回 ${s.status_counts.rejected} · 漏报 ${s.missing_person_days} 人日 · 待报销 ${money(s.pending_reimbursement)} · 冲销待处理 ${s.reversed_reimbursement_count} 笔</span></div><div><b>预计净GMV ${money(c.gmv)}</b><span>综合投入 ${money(Number(c.ad_spend||0)+Number(c.account_cost||0))} · 阶段贡献利润 ${money(c.profit)}</span></div>${d.blockers.length?`<div class="preflight-list">${d.blockers.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}`;closeBtn.disabled=!(d.ready||onlyMissing&&allowMissing.checked&&note.value.trim().length>=5)}catch(e){preflight.className='preflight blocked';preflight.innerHTML=`<b>预检失败</b><span>${esc(e.message)}</span>`;closeBtn.disabled=true}}
function render(){rows.innerHTML=DATA.length?DATA.map(x=>{const s=x.snapshot||{},c=s.company||{};return `<tr><td data-label="期间 / 范围"><b>${esc(x.start)} 至 ${esc(x.end)}</b><div class="sub">${scopeName(x)} · ${esc(x.created_by)}创建</div></td><td data-label="版本">V${x.version}</td><td data-label="状态"><span class="status ${x.status==='closed'?'confirmed':'rejected'}">${x.status==='closed'?'已结算锁定':'已重新打开'}</span>${x.reopen_reason?'<div class="sub">'+esc(x.reopen_reason)+'</div>':''}</td><td data-label="净GMV">${money(c.gmv)}</td><td data-label="综合投入">${money(Number(c.ad_spend||0)+Number(c.account_cost||0))}</td><td data-label="阶段贡献利润" class="${Number(c.profit)<0?'negative':'positive'}">${money(c.profit)}</td><td data-label="日报 / 漏报">${c.report_count||0} 份<div class="sub">漏报 ${s.missing_person_days||0} 人日</div></td><td data-label="快照校验"><code title="${esc(x.snapshot_hash)}">${esc(String(x.snapshot_hash||'').slice(0,12))}…</code></td><td data-label="操作">${x.status==='closed'?`<button class="btn danger" onclick="reopenSettlement(${x.id},this)">重新打开</button>`:'<span class="sub">旧快照已保留</span>'}</td></tr>`}).join(''):'<tr><td colspan="9" class="empty">尚无结算版本</td></tr>';labelDynamicControls(rows)}
async function loadData(){const seq=++loadSeq;setPageLoading(true);try{const d=await api('/ecom/v2/settlements');if(seq!==loadSeq)return;DATA=d.settlements;render()}catch(e){if(seq===loadSeq)toast(e.message)}finally{if(seq===loadSeq)setPageLoading(false)}}
async function closeSettlement(button){if(!start.value||!end.value)return toast('请选择结算日期');if(start.value>end.value)return toast('开始日期不能晚于结束日期');if(allowMissing.checked&&note.value.trim().length<5)return toast('允许漏报结算时，必须填写至少5字说明');if(!confirm(`确认结算 ${start.value} 至 ${end.value} · ${group.options[group.selectedIndex].text}？\n结算后对应日报将不能修改或退回。`))return;setBusy(button,true,'核验中…');try{const d=await api('/ecom/v2/settlement/close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start:start.value,end:end.value,group_no:Number(group.value),note:note.value,allow_missing:allowMissing.checked})});toast(`结算V${d.version}已生成，校验值 ${d.snapshot_hash.slice(0,12)}…`,true);await loadData();await loadPreview()}catch(e){toast(e.message);await loadPreview()}finally{setBusy(button,false)}}
async function reopenSettlement(id,button){const reason=prompt('请输入重新打开原因（至少5个字）；旧快照会永久保留。','');if(reason===null)return;if(reason.trim().length<5)return toast('重新打开原因至少5个字');if(!confirm('确认重新打开该结算？对应期间将恢复可修改状态。'))return;setBusy(button,true,'打开中…');try{await api('/ecom/v2/settlement/reopen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,reason})});toast('结算已重新打开，旧快照仍保留',true);await loadData()}catch(e){toast(e.message)}finally{setBusy(button,false)}}
async function init(){try{const d=await identity();if(d.me.role!=='admin')throw new Error('仅老板/管理员可使用结算中心');renderNav(d.me,'结算');group.innerHTML+=d.groups.map(x=>`<option value="${x.group_no}">${esc(x.group_name)}</option>`).join('');const r=rangeOf('month');start.value=r[0];end.value=r[1];start.max=shDate();end.max=shDate();[start,end,group,allowMissing,note].forEach(el=>el.addEventListener(el===note?'input':'change',schedulePreview));loadData();loadPreview()}catch(e){toast(e.message)}}init();
</script></body></html>
