    # 徐州舟格电商运营管理系统：后端 8312，数据库、密码与会话独立
    location = /board13/api/login {
        proxy_pass http://127.0.0.1:8312/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }
    location = /board13/api/logout {
        proxy_pass http://127.0.0.1:8312/logout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }
    location = /board13/api/health {
        proxy_pass http://127.0.0.1:8312/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }
    location ^~ /board13/api/ {
        auth_request /_zb13auth;
        error_page 401 403 = @zb13assetdenied;
        proxy_pass http://127.0.0.1:8312/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 135m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location ^~ /zb-t1365d2f4f3/_uploads/_thumb/ {
        auth_request /_zb13auth;
        error_page 401 403 = @zb13assetdenied;
        add_header Cache-Control "private, max-age=86400";
        try_files $uri =404;
    }
    location ^~ /zb-t1365d2f4f3/_uploads/og/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location = /zb-t1365d2f4f3/theme/night-theme.css {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location ~* "^/zb-t1365d2f4f3/(?!_uploads/og/).+\.(?:css|js|mjs|map|json|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|mp4|mov|webm|m4v|mp3|wav|pdf|doc|docx|xls|xlsx|ppt|pptx|zip)$" {
        auth_request /_zb13auth;
        error_page 401 403 = @zb13assetdenied;
        add_header Cache-Control "private, no-store";
        try_files $uri =404;
    }
    location = /zb-t1365d2f4f3/login.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location ^~ /zb-t1365d2f4f3/_share/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store";
        try_files $uri /zb-t1365d2f4f3/login.html;
    }
    location ~* "^/zb-t1365d2f4f3/.+\.html$" {
        auth_request /_zb13auth;
        error_page 401 = @zb13login;
        error_page 403 = @noperm13;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location = /_zb13auth {
        internal;
        client_max_body_size 135m;
        proxy_pass http://127.0.0.1:8312/authcheck;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }
    location @zb13login {
        rewrite ^/zb-t1365d2f4f3/(.+\.html)$ /zb-t1365d2f4f3/_share/$1 last;
        return 302 /zb-t1365d2f4f3/login.html?next=$request_uri;
    }
    location @noperm13 {
        return 302 /zb-t1365d2f4f3/login.html?next=$request_uri&e=admin;
    }
    location @zb13assetdenied {
        return 401;
    }
