# CentOS 7 / systemd 219 baseline candidate:
# /etc/systemd/system/team13-board.service.d/20-hardening.conf
# 必须先在预发布验证。当前 SQLite 数据库位于应用目录，需要允许该目录创建 journal/WAL/SHM；
# 因此再用 ReadOnlyPaths 覆盖代码、密钥和运维制品，上传目录单独开放。
[Service]
UMask=0077
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=full
ProtectHome=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
CapabilityBoundingSet=
LimitNOFILE=8192
LimitNPROC=128
MemoryLimit=1G
Environment=PYTHONDONTWRITEBYTECODE=1

# SQLite 可能在 board.db 同目录创建 -journal/-wal/-shm，不能只放开单个 DB 文件。
ReadWritePaths=/opt/your-app-dir
ReadWritePaths=/www/wwwroot/default-site/YOUR_HIDDEN_PREFIX/_uploads

# 在上面的可写父目录内重新封住代码、密钥、发布包和历史材料。
ReadOnlyPaths=/opt/your-app-dir/app.py
ReadOnlyPaths=/opt/your-app-dir/private
ReadOnlyPaths=/opt/your-app-dir/ops
ReadOnlyPaths=-/opt/your-app-dir/releases
ReadOnlyPaths=-/opt/your-app-dir/backups
ReadOnlyPaths=-/opt/your-app-dir/site-repo
ReadOnlyPaths=-/opt/your-app-dir/builders
ReadOnlyPaths=-/opt/your-app-dir/docs

# 服务本身不需要读取这些备份目录；cron/root 进程不受本 unit namespace 影响。
InaccessiblePaths=-/opt/your-app-dir-hourly-backup
InaccessiblePaths=-/opt/team13-uploads-backup
InaccessiblePaths=-/opt/your-app-dir-backup
